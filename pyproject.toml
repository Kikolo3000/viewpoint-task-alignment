[project]
name = "folk-patterns-repro"
version = "1.0.0"
description = "Reproducibility package for the TISMIR paper on pattern-derived features for folk music classification"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=19.0",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "adjustText>=1.2",
    "shap>=0.45",
    "umap-learn>=0.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folk_patterns_repro"]
